# -----------------------------------------------------------------------------
# IRIS Command Center — one-command startup: `docker compose up`
#
#   iris      InterSystems IRIS 2026.2 (Community), with a persistent USER
#             database (named volume) holding CommandCenter.Knowledge and
#             ^CommandCenterTrace.
#   backend   FastAPI Command Center API — starts once IRIS is healthy and
#             reaches it over the Compose network (iris:52773 / iris:1972).
#
# The web console is served by IRIS itself: on every start IRIS installs the
# iris-command-center IPM package (module.xml + frontend/, mounted read-only),
# so the application runs at
#   http://localhost:52773/iris-command-center/index.html
# The console calls the backend at http://localhost:8000 (its CORS allows the
# IRIS origin, http://localhost:52773).
#
# Host ports: IRIS 52773 / 1973 (superserver) / 53773, backend 8000.
#
# Credentials come from `.env` (copy .env.example). They must match the IRIS
# instance's own login.
# -----------------------------------------------------------------------------

services:
  iris:
    image: intersystemsdc/iris-community:2026.2
    # Call /iris-main directly: the image's first-start hook crashes a new
    # container (at its irissqlcli step), and we don't need anything it does.
    # The --after script runs on every start: it un-expires the default
    # passwords and (re)installs the web console package. Both are safe to
    # repeat.
    entrypoint: ["/tini", "--", "/iris-main"]
    command:
      - "--ISCAgent"
      - "false"
      - "--after"
      - "sh /home/irisowner/iris-after-start.sh"
    ports:
      - "52773:52773"
      - "1973:1972"
      - "53773:53773"
    volumes:
      # A new, empty named volume is initialized by Docker from the image's
      # own USER database (IRIS.DAT, owned by irisowner), then persists across
      # container recreation.
      - iris-user:/usr/irissys/mgr/user
      # The IPM package the after-start script installs (read-only).
      - ./module.xml:/home/irisowner/dev/module.xml:ro
      - ./frontend:/home/irisowner/dev/frontend:ro
      - ./docker/iris-after-start.sh:/home/irisowner/iris-after-start.sh:ro
    healthcheck:
      # The image's own check, on a shorter interval than its 60 s default.
      test: ["CMD", "/irisHealth.sh"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    # Give IRIS time for a clean shutdown (only the USER database persists).
    stop_grace_period: 60s

  backend:
    build: .
    depends_on:
      iris:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      IRIS_BASE_URL: http://iris:52773
      IRIS_USERNAME: ${IRIS_USERNAME:?set IRIS_USERNAME in .env (see .env.example)}
      IRIS_PASSWORD: ${IRIS_PASSWORD:?set IRIS_PASSWORD in .env (see .env.example)}
      IRIS_NAMESPACE: USER
      # The superserver port inside the Compose network (the host-side 1973
      # mapping applies only to clients outside Docker).
      IRIS_SUPERSERVER_PORT: "1972"
      ENABLE_KNOWLEDGE_SEARCH: "true"
      PERSIST_TRACES_TO_IRIS: "true"
      # Run the Demo Activity once on the first successful start (a marker in
      # USER stops it from running again).
      AUTO_RUN_DEMO_ACTIVITY: "true"

volumes:
  iris-user:
