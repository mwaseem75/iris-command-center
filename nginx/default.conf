# nginx server config for docker-compose.yml's `frontend` service — the
# stock nginx:alpine default.conf, plus revalidation headers for scripts and
# stylesheets.
#
# Without an explicit Cache-Control, browsers heuristically cache .js/.css
# (from Last-Modified) and can keep running stale frontend code after an
# update. `no-cache` still allows caching but makes the browser revalidate
# every time (a cheap 304 via the existing ETag/Last-Modified when unchanged).

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;

    location / {
        index  index.html index.htm;
    }

    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
